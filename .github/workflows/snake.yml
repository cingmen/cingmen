name: 🐍 Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # runs daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate neon snake from GitHub contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: cingmen
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=neon-green&color_snake=#39d353&color_dots=#ebedf0,#9be9a8,#40c463,#2da44e,#1a7f37
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
